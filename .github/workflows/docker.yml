name: docker

on:
    push:
        branches:
            - master
            - main
        tags:
            - 'v*'
    workflow_dispatch:

permissions:
    contents: read
    packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Docker Image
    steps:
        -
            name: Checkout
            uses: actions/checkout@v6

        - 
            name: Docker meta
            id: meta
            uses: docker/metadata-action@v5
            with:
                images: ghcr.io/${{ github.repository_owner }}/xiaoya-emd-go
                tags: |
                    type=sha,prefix=sha-
                    type=ref,event=tag

        -
            name: Set Up QEMU
            uses: docker/setup-qemu-action@v3

        -
            name: Set Up Buildx
            uses: docker/setup-buildx-action@v3

        -
            name: Login GHCR
            uses: docker/login-action@v3
            with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

        -
            name: Build Image
            uses: docker/build-push-action@v6
            with:
                context: .
                file: Dockerfile
                platforms: |
                    linux/amd64
                    linux/arm64/v8
                push: true
                tags: ${{ steps.meta.outputs.tags }}
                labels: ${{ steps.meta.outputs.labels }}
            env:
                DOCKER_BUILD_RECORD_UPLOAD: false
